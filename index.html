<style>
  :root {
    --ink: #1c2320;
    --paper: #f4f1ea;
    --line: #ddd7c8;
    --accent: #c9a227;
    --accent-dark: #a5821c;
    --shield: #1c1c1c;
    --shield-soft: #2a2a2a;
    --danger: #b3272c;
    --muted: #7c8079;
    --card-shadow: 0 1px 3px rgba(28,35,32,0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 0 0 60px;
  }
  header {
    background: var(--shield);
    color: var(--paper);
    padding: 18px 16px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 3px solid var(--accent);
  }
  header img.logo { width: 46px; height: 46px; flex-shrink: 0; border-radius: 11px; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
  header .titles h1 {
    font-size: 1.15rem;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  header .titles p {
    margin: 2px 0 0;
    font-size: 0.72rem;
    color: #b8bcb4;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 18px 14px 0; }
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 4px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 6px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
  }
  .tab.active { background: var(--shield); color: var(--paper); }
  .panel { display: none; }
  .panel.active { display: block; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type="text"] {
    width: 100%;
    padding: 13px 14px;
    font-size: 0.95rem;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:active { transform: scale(0.97); }
  .btn-primary { background: var(--shield); color: var(--paper); }
  .btn-secondary { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  .btn-ghost { background: transparent; color: var(--muted); padding: 6px 10px; font-weight: 500; font-size: 0.75rem; }

  .count { font-size: 0.78rem; color: var(--muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .results { display: flex; flex-direction: column; gap: 10px; }
  .row {
    padding: 13px 14px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--card-shadow);
  }
  .row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .assurance { font-size: 0.96rem; font-weight: 600; line-height: 1.3; color: var(--ink); }
  .row-icons { display: flex; gap: 2px; flex-shrink: 0; margin-top: -2px; }

  .assist-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #faf8f2;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .badge {
    width: 36px; height: 36px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; font-weight: 700; color: #fff;
    flex-shrink: 0; letter-spacing: -0.02em;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }
  .assist-info { min-width: 0; flex: 1; }
  .assist-name { font-size: 0.82rem; font-weight: 600; color: var(--ink); line-height: 1.25; }
  .phone-link {
    font-size: 0.86rem; color: var(--shield); text-decoration: none; font-weight: 700;
    display: inline-flex; align-items: center; gap: 4px; margin-top: 1px;
  }
  .phone-link::before { content: "📞"; font-size: 0.78rem; }
  .phone-link:active { opacity: 0.55; }
  .no-phone { font-size: 0.74rem; color: var(--muted); font-style: italic; margin-top: 1px; display: block; }
  .icon-btn { background: transparent; border: none; font-size: 0.95rem; padding: 4px 7px; cursor: pointer; color: var(--muted); border-radius: 6px; }
  .icon-btn:hover { background: rgba(0,0,0,0.05); }
  .empty { font-size: 0.9rem; color: var(--muted); text-align: center; padding: 30px 0; }

  .edit-form { display: flex; flex-direction: column; gap: 8px; }
  .edit-fields { display: flex; gap: 8px; }
  .edit-fields input { flex: 1; padding: 8px 10px; font-size: 0.85rem; }
  .edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .edit-actions button { padding: 6px 12px; font-size: 0.76rem; }

  .add-panel { background: #fff; border: 1.5px solid var(--accent); border-radius: 10px; padding: 14px; margin-bottom: 16px; display: none; }
  .add-panel.open { display: block; }
  .add-panel .fields { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .add-panel label { font-size: 0.72rem; color: var(--muted); margin-bottom: -4px; }
  .add-panel .actions { display: flex; gap: 8px; justify-content: flex-end; }

  .status-bar { font-size: 0.7rem; color: var(--muted); text-align: center; margin-top: 4px; min-height: 16px; }
  footer { font-size: 0.7rem; color: var(--muted); text-align: center; margin-top: 24px; padding-bottom: 10px; }
</style>
</head>

const KEY_ENTRIES = 'fereol_assurance_entries';
const KEY_ASSISTEURS = 'fereol_assisteurs';

let entries = [];
let assisteurs = [];
let editingEntryId = null;
let editingAssisteurKey = null;

function normalize(str) {
  return (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
}
function escapeHtml(str) {
  const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
}
function telHref(phone) {
  return 'tel:' + phone.replace(/[^\d+]/g, '');
}

function loadData() {
  try {
    const e = localStorage.getItem(KEY_ENTRIES);
    entries = e ? JSON.parse(e) : SEED.entries.slice();
  } catch (err) { entries = SEED.entries.slice(); }
  try {
    const a = localStorage.getItem(KEY_ASSISTEURS);
    assisteurs = a ? JSON.parse(a) : SEED.assisteurs.slice();
  } catch (err) { assisteurs = SEED.assisteurs.slice(); }
  persistEntries(); persistAssisteurs();
  sortAll();
}

function sortAll() {
  entries.sort((x, y) => x.assurance.toUpperCase().localeCompare(y.assurance.toUpperCase()));
  assisteurs.sort((x, y) => x.label.toUpperCase().localeCompare(y.label.toUpperCase()));
}

function persistEntries() {
  try { localStorage.setItem(KEY_ENTRIES, JSON.stringify(entries)); flashStatus('statusA', 'Enregistré ✓'); }
  catch (err) { flashStatus('statusA', 'Erreur d\'enregistrement local'); }
}
function persistAssisteurs() {
  try { localStorage.setItem(KEY_ASSISTEURS, JSON.stringify(assisteurs)); flashStatus('statusB', 'Enregistré ✓'); }
  catch (err) { flashStatus('statusB', 'Erreur d\'enregistrement local'); }
}
function flashStatus(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 1500);
}

function findAssisteur(assistanceValue) {
  const n = normalize(assistanceValue);
  return assisteurs.find(a => normalize(a.key) === n) || null;
}

// ---------------- TABS ----------------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

// ---------------- ASSURANCES PANEL ----------------
const searchA = document.getElementById('searchA');
const resultsA = document.getElementById('resultsA');
const countA = document.getElementById('countA');

function searchEntries(q) {
  const n = normalize(q.trim());
  if (!n) return entries;
  const starts = [];
  const contains = [];
  entries.forEach(e => {
    const an = normalize(e.assurance);
    if (an.startsWith(n)) starts.push(e);
    else if (an.includes(n) || normalize(e.assistance).includes(n)) contains.push(e);
  });
  return starts.concat(contains);
}

function renderA(list) {
  resultsA.innerHTML = '';
  countA.textContent = list.length + ' résultat' + (list.length !== 1 ? 's' : '') + (searchA.value.trim() === '' ? ' (tous)' : '');
  if (list.length === 0) { resultsA.innerHTML = '<div class="empty">Aucune entrée trouvée.</div>'; return; }
  const frag = document.createDocumentFragment();
  list.forEach(item => {
    const row = document.createElement('div');
    row.className = 'row';
    const ass = findAssisteur(item.assistance);

    if (editingEntryId === item.id) {
      row.innerHTML = `
        <div class="edit-form">
          <div class="edit-fields">
            <input type="text" id="editAssurance" value="${escapeHtml(item.assurance)}">
            <input type="text" id="editAssistance" value="${escapeHtml(item.assistance)}">
          </div>
          <div class="edit-actions">
            <button class="btn-secondary" data-action="cancel-edit-a">Annuler</button>
            <button class="btn-primary" data-action="save-edit-a" data-id="${item.id}">Enregistrer</button>
          </div>
        </div>`;
    } else {
      const badgeColor = ass ? ass.color : '#9a978a';
      const badgeText = ass ? ass.initials : item.assistance.slice(0,3).toUpperCase();
      const assistLabel = ass ? ass.label : item.assistance;
      const phoneHtml = ass && ass.phone
        ? `<a class="phone-link" href="${telHref(ass.phone)}">${escapeHtml(ass.phone)}</a>`
        : `<span class="no-phone">n° à ajouter</span>`;
      row.innerHTML = `
        <div class="row-top">
          <div class="assurance">${escapeHtml(item.assurance)}</div>
          <div class="row-icons">
            <button class="icon-btn" data-action="edit-a" data-id="${item.id}" title="Modifier">✎</button>
            <button class="icon-btn" data-action="delete-a" data-id="${item.id}" title="Supprimer">✕</button>
          </div>
        </div>
        <div class="assist-chip">
          <div class="badge" style="background:${badgeColor}">${badgeText}</div>
          <div class="assist-info">
            <div class="assist-name">${escapeHtml(assistLabel)}</div>
            ${phoneHtml}
          </div>
        </div>`;
    }
    frag.appendChild(row);
  });
  resultsA.appendChild(frag);
}

resultsA.addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id ? parseInt(btn.dataset.id) : null;
  if (action === 'edit-a') { editingEntryId = id; renderA(searchEntries(searchA.value)); }
  else if (action === 'cancel-edit-a') { editingEntryId = null; renderA(searchEntries(searchA.value)); }
  else if (action === 'save-edit-a') {
    const na = document.getElementById('editAssurance').value.trim();
    const ni = document.getElementById('editAssistance').value.trim();
    if (!na || !ni) return;
    const idx = entries.findIndex(x => x.id === id);
    if (idx !== -1) { entries[idx].assurance = na; entries[idx].assistance = ni; }
    editingEntryId = null; sortAll(); persistEntries(); renderA(searchEntries(searchA.value));
  } else if (action === 'delete-a') {
    if (!confirm('Supprimer cette entrée ?')) return;
    entries = entries.filter(x => x.id !== id);
    persistEntries(); renderA(searchEntries(searchA.value));
  }
});

searchA.addEventListener('input', () => renderA(searchEntries(searchA.value)));

document.getElementById('btnToggleAddA').addEventListener('click', () => {
  document.getElementById('addPanelA').classList.toggle('open');
});
document.getElementById('btnCancelAddA').addEventListener('click', () => {
  document.getElementById('newAssurance').value = '';
  document.getElementById('newAssistance').value = '';
  document.getElementById('addPanelA').classList.remove('open');
});
document.getElementById('btnSaveAddA').addEventListener('click', () => {
  const a = document.getElementById('newAssurance').value.trim();
  const b = document.getElementById('newAssistance').value.trim();
  if (!a || !b) { alert('Merci de remplir les deux champs.'); return; }
  const nextId = entries.reduce((m, e) => Math.max(m, e.id), 0) + 1;
  entries.push({ id: nextId, assurance: a, assistance: b, maj_hlpy: false });
  document.getElementById('newAssurance').value = '';
  document.getElementById('newAssistance').value = '';
  document.getElementById('addPanelA').classList.remove('open');
  sortAll(); persistEntries(); renderA(searchEntries(searchA.value));
});
document.getElementById('btnResetA').addEventListener('click', () => {
  if (!confirm('Cela remplacera toutes vos modifications par les données d\'origine. Continuer ?')) return;
  entries = SEED.entries.slice(); sortAll(); persistEntries(); renderA(searchEntries(searchA.value));
});

// ---------------- ASSISTEURS PANEL ----------------
const searchB = document.getElementById('searchB');
const resultsB = document.getElementById('resultsB');
const countB = document.getElementById('countB');

function searchAssisteurs(q) {
  const n = normalize(q.trim());
  if (!n) return assisteurs;
  const starts = [];
  const contains = [];
  assisteurs.forEach(a => {
    const ln = normalize(a.label);
    if (ln.startsWith(n)) starts.push(a);
    else if (ln.includes(n) || normalize(a.key).includes(n) || (a.phone||'').includes(q.trim())) contains.push(a);
  });
  return starts.concat(contains);
}

function renderB(list) {
  resultsB.innerHTML = '';
  countB.textContent = list.length + ' assisteur' + (list.length !== 1 ? 's' : '') + (searchB.value.trim() === '' ? ' (tous)' : '');
  if (list.length === 0) { resultsB.innerHTML = '<div class="empty">Aucun assisteur trouvé.</div>'; return; }
  const frag = document.createDocumentFragment();
  list.forEach(item => {
    const row = document.createElement('div');
    row.className = 'row';

    if (editingAssisteurKey === item.key) {
      row.innerHTML = `
        <div class="edit-form">
          <div class="edit-fields">
            <input type="text" id="editLabel" value="${escapeHtml(item.label)}">
            <input type="text" id="editPhone" value="${escapeHtml(item.phone || '')}">
          </div>
          <div class="edit-actions">
            <button class="btn-secondary" data-action="cancel-edit-b">Annuler</button>
            <button class="btn-primary" data-action="save-edit-b" data-key="${escapeHtml(item.key)}">Enregistrer</button>
          </div>
        </div>`;
    } else {
      const phoneHtml = item.phone
        ? `<a class="phone-link" href="${telHref(item.phone)}">${escapeHtml(item.phone)}</a>`
        : `<span class="no-phone">n° à ajouter</span>`;
      row.innerHTML = `
        <div class="row-top">
          <div class="assurance">${escapeHtml(item.label)}</div>
          <div class="row-icons">
            <button class="icon-btn" data-action="edit-b" data-key="${escapeHtml(item.key)}" title="Modifier">✎</button>
            <button class="icon-btn" data-action="delete-b" data-key="${escapeHtml(item.key)}" title="Supprimer">✕</button>
          </div>
        </div>
        <div class="assist-chip">
          <div class="badge" style="background:${item.color || '#9a978a'}">${escapeHtml(item.initials || item.key.slice(0,3))}</div>
          <div class="assist-info">
            ${phoneHtml}
          </div>
        </div>`;
    }
    frag.appendChild(row);
  });
  resultsB.appendChild(frag);
}

resultsB.addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return;
  const action = btn.dataset.action;
  const key = btn.dataset.key;
  if (action === 'edit-b') { editingAssisteurKey = key; renderB(searchAssisteurs(searchB.value)); }
  else if (action === 'cancel-edit-b') { editingAssisteurKey = null; renderB(searchAssisteurs(searchB.value)); }
  else if (action === 'save-edit-b') {
    const nl = document.getElementById('editLabel').value.trim();
    const np = document.getElementById('editPhone').value.trim();
    if (!nl) return;
    const idx = assisteurs.findIndex(x => x.key === key);
    if (idx !== -1) { assisteurs[idx].label = nl; assisteurs[idx].phone = np; }
    editingAssisteurKey = null; sortAll(); persistAssisteurs(); renderB(searchAssisteurs(searchB.value)); renderA(searchEntries(searchA.value));
  } else if (action === 'delete-b') {
    if (!confirm('Supprimer cet assisteur de l\'annuaire ?')) return;
    assisteurs = assisteurs.filter(x => x.key !== key);
    persistAssisteurs(); renderB(searchAssisteurs(searchB.value)); renderA(searchEntries(searchA.value));
  }
});

searchB.addEventListener('input', () => renderB(searchAssisteurs(searchB.value)));

document.getElementById('btnToggleAddB').addEventListener('click', () => {
  document.getElementById('addPanelB').classList.toggle('open');
});
document.getElementById('btnCancelAddB').addEventListener('click', () => {
  document.getElementById('newLabel').value = '';
  document.getElementById('newKey').value = '';
  document.getElementById('newPhone').value = '';
  document.getElementById('addPanelB').classList.remove('open');
});
document.getElementById('btnSaveAddB').addEventListener('click', () => {
  const label = document.getElementById('newLabel').value.trim();
  const key = document.getElementById('newKey').value.trim();
  const phone = document.getElementById('newPhone').value.trim();
  if (!label || !key) { alert('Merci de remplir au moins le nom et la clé courte.'); return; }
  if (assisteurs.some(a => normalize(a.key) === normalize(key))) { alert('Cette clé existe déjà.'); return; }
  const palette = ['#1f7a6c','#c0392b','#00008f','#1a3a6b','#2c4b9b','#2e8b3d','#8a6d3b','#b3121b','#3fae4a','#233a66'];
  const color = palette[assisteurs.length % palette.length];
  assisteurs.push({ key, label, phone, initials: key.slice(0,3).toUpperCase(), color });
  document.getElementById('newLabel').value = '';
  document.getElementById('newKey').value = '';
  document.getElementById('newPhone').value = '';
  document.getElementById('addPanelB').classList.remove('open');
  sortAll(); persistAssisteurs(); renderB(searchAssisteurs(searchB.value));
});
document.getElementById('btnResetB').addEventListener('click', () => {
  if (!confirm('Cela remplacera toutes vos modifications par les données d\'origine. Continuer ?')) return;
  assisteurs = SEED.assisteurs.slice(); sortAll(); persistAssisteurs(); renderB(searchAssisteurs(searchB.value)); renderA(searchEntries(searchA.value));
});

// ---------------- INIT ----------------
loadData();
renderA(entries);
renderB(assisteurs);
</script>
</body>
</html>
